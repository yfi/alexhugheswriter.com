excerpt: 'The Hot Take: KD may be Canada''s number one noodle, but the boxed mac and cheese aisle has gotten pretty crowded, so we partnered with The Beer Store and released the world''s first KD 2-4 for the May 2-4, so people could spend less time prepping for the long weekend and more time enjoying it.'
